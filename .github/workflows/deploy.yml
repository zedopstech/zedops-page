name: Deploy site

# Push to main only, plus manual runs.
#
# Deliberately NOT using `pull_request` or `pull_request_target`:
# `pull_request_target` runs with access to repository secrets while checking out
# a contributor's code, which is a remote-code-execution path on a public repo.
# This repo is public, so a push to main is the only trigger that can deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other on the same server.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag by commit SHA for traceability, plus latest for the server to pull.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://zedops.com' }}

      - name: Deploy to server over SSH
        env:
          # All three come from repo secrets; nothing sensitive is in this file,
          # which is readable by anyone because the repo is public.
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the server's host key so we fail loudly rather than talk to an
          # impostor. Re-fetch with: ssh-keyscan -t ed25519 <host>
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          187.127.169.156 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDyaLck+IpI72AnjITZVwdTGNakhdk0RV8nR4iCHZHhV
          KNOWN_HOSTS

          # Container name is referenced by the edge Caddy config
          # (reverse_proxy zedops-live:3000) - it must not change.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd /home/zedops/zedops-page-live

          # Point the compose file at the exact image CI just built.
          export ZEDOPS_IMAGE="${IMAGE}"
          docker compose pull web
          docker compose up -d --remove-orphans
          docker image prune -f

          echo "--- containers ---"
          docker ps --filter name=zedops-live --format '{{.Names}}  {{.Image}}  {{.Status}}'

          # Health check runs INSIDE the container: port 3000 is only `expose`d to
          # the Docker network, so it is not reachable from the host.
          echo "--- health check ---"
          for i in \$(seq 1 20); do
            if docker exec zedops-live wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "site responding 200 after \${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: site did not respond within 20s"
          docker logs --tail 50 zedops-live || true
          exit 1
          REMOTE

          rm -f ~/.ssh/deploy_key
