name: Deploy site

# Push to main only, plus manual runs.
#
# Deliberately NOT using `pull_request` or `pull_request_target`:
# `pull_request_target` runs with access to repository secrets while checking out
# a contributor's code, which is a remote-code-execution path on a public repo.
# This repo is public, so a push to main is the only trigger that can deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other on the same server.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Notes on the build-args block below, since both cost a debugging cycle:
      #  - No comments inside that block. Every line is passed to docker as an
      #    argument, so a `#` comment line becomes literal `--build-arg #` pairs.
      #  - The Dockerfile must declare a matching ARG for each value, otherwise it
      #    never enters the build environment and the site ships without the tag
      #    while the build still reports success.
      #  - `vars` is preferred and `secrets` is the fallback, because GitHub keeps
      #    the two stores separate and one is ignored by the other.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Tag by commit SHA for traceability, plus latest as a fallback.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL || 'https://zedops.com' }}
            VITE_GA_ID=${{ vars.VITE_GA_ID || secrets.VITE_GA_ID }}

      - name: Deploy to server over SSH
        env:
          # All three come from repo secrets; nothing sensitive is in this file,
          # which is readable by anyone because the repo is public.
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the server's host key so we fail loudly rather than talk to an
          # impostor. Re-fetch with: ssh-keyscan -t ed25519 <host>
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          187.127.169.156 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDyaLck+IpI72AnjITZVwdTGNakhdk0RV8nR4iCHZHhV
          KNOWN_HOSTS

          trap 'rm -f ~/.ssh/deploy_key' EXIT

          # The server must run the compose file from THIS repo, not a stale copy
          # left on the host. An earlier version of this workflow ran against the
          # server's own file, which still defined a service called `nextjs`
          # while the repo calls it `web` - so `docker compose pull web` failed
          # and every deploy died *after* the image had already been built.
          echo "::group::Sync compose file to server"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/deploy_key docker-compose.yml \
              "$DEPLOY_USER@$DEPLOY_HOST:/home/zedops/zedops-page-live/docker-compose.yml"
          echo "::endgroup::"

          echo "::group::Deploy over SSH"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd /home/zedops/zedops-page-live
          export ZEDOPS_IMAGE="${IMAGE}"

          # Stop the previous stack first. The new container claims the name
          # zedops-live, which the running one is holding, so `up` alone fails
          # with a name conflict.
          docker compose down --remove-orphans
          docker compose pull web
          docker compose up -d --remove-orphans

          # Image retention. `docker image prune -f` only removes *untagged*
          # images, so every deploy's SHA-tagged image accumulated at ~130 MB each
          # - ~800 MB across 6 images before this was noticed. Docker refuses to
          # remove the image a running container uses, so this is self-protecting.
          echo "--- image retention ---"
          docker images --format '{{.Repository}}:{{.Tag}}' | grep 'zedops-page' | grep -v ':latest$' | while read -r old; do
            if docker rmi "$old" >/dev/null 2>&1; then echo "  removed $old"; else echo "  kept $old (in use)"; fi
          done
          docker image prune -f >/dev/null 2>&1 || true
          df -h / | tail -1

          echo "--- container ---"
          docker ps --filter name=zedops-live --format '{{.Names}}  {{.Image}}  {{.Status}}'

          # Health check runs INSIDE the container: port 3000 is only `expose`d to
          # the Docker network, so it is not reachable from the host.
          echo "--- health check ---"
          for i in \$(seq 1 20); do
            if docker exec zedops-live wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "site responding after \${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: site did not respond within 20s"
          docker logs --tail 50 zedops-live || true
          exit 1
          REMOTE
          echo "::endgroup::"
